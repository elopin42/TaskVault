{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server error · Lowbid</title>
  {# Standalone on purpose (no base.html, no context processors): only the token sheet, so the palette stays the single source of colours. #}
  <link rel="stylesheet" href="{% static 'css/lowbid-tokens.css' %}">
  <style>
    html { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: var(--font-sans);
           background: var(--bg-1); color: var(--text); }
    .card { max-width: 28rem; padding: 2rem; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: var(--muted); font-size: .9rem; line-height: 1.5; }
    a { display: inline-block; margin-top: 1rem; padding: .6rem 1.1rem; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>500 · Server error</h1>
    <p>Something broke on our side. Try again in a moment.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
