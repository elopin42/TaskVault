{% comment %}{% include "components/empty_state.html" with icon="fa-gavel" title="Aucun besoin" desc="…" cta_href=url cta_label="Poster" cta_icon="fa-plus" %}{% endcomment %}<div class="empty-state glass-card{% if class %} {{ class }}{% endif %}">
  <div class="empty-state-icon"><i class="fa-solid {{ icon|default:'fa-inbox' }}" aria-hidden="true"></i></div>
  <div class="empty-state-title">{{ title }}</div>
  {% if desc %}<p class="empty-state-desc">{{ desc }}</p>{% endif %}
  {% if cta_href %}<a href="{{ cta_href }}" class="ui-btn ui-btn-primary mt-4">{% if cta_icon %}<i class="fa-solid {{ cta_icon }}" aria-hidden="true"></i> {% endif %}{{ cta_label }}</a>{% endif %}
</div>
