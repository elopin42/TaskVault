{# Global confirm dialog driven by Lowbid.confirm() (lowbid-ui.js). One per page, in base.html. #}
<dialog id="lb-confirm" class="ui-modal" aria-labelledby="lb-confirm-title">
  <form method="dialog" class="ui-modal-card">
    <div class="ui-modal-icon" data-modal-icon aria-hidden="true"><i class="fa-solid fa-circle-question"></i></div>
    <h2 id="lb-confirm-title" class="ui-modal-title" data-modal-title>Confirmer</h2>
    <p class="ui-modal-body" data-modal-body></p>
    <div class="ui-modal-actions">
      <button type="submit" value="cancel" class="ui-btn ui-btn-ghost" data-modal-cancel>Annuler</button>
      <button type="submit" value="ok" class="ui-btn ui-btn-primary" data-modal-ok data-autofocus>Confirmer</button>
    </div>
  </form>
</dialog>
